name: Release WordPress Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installable ZIP
        run: |
          mkdir -p dist
          cd woo-order-permissions-statuses
          zip -r ../dist/woo-order-permissions-statuses-${GITHUB_REF_NAME}.zip . -x '*.DS_Store'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
